name: RightKit

options:
  bundleIdPrefix: com.dozecat
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  # Info.plist's CFBundleDevelopmentRegion is $(DEVELOPMENT_LANGUAGE), which the
  # project's developmentRegion fills in. Left unset it becomes en, so a missing
  # lproj falls back to English — turning a Chinese interface English. Set it
  # explicitly instead: the source language of Localizable.xcstrings is zh-Hans.
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "6T9RSL7KL6"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  RightKit:
    type: application
    platform: macOS
    sources:
      - path: RightKit
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources/BuiltinTemplates"
          - "Resources/BuiltinScripts"
      # Copied verbatim into Contents/Resources/BuiltinTemplates so that
      # NewFileService can resolve starter documents by subdirectory.
      - path: RightKit/Resources/BuiltinTemplates
        type: folder
        buildPhase: resources
      # Bundled script packages, copied verbatim so the seeder can hand them to
      # the user's scripts directory with their layout intact.
      - path: RightKit/Resources/BuiltinScripts
        type: folder
        buildPhase: resources
      - path: Shared
      - path: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dozecat.RightKit
        PRODUCT_NAME: RightKit
        INFOPLIST_FILE: RightKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: RightKit/RightKit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode 15+ generates Swift asset symbols (GeneratedAssetSymbols.swift) by
        # default. This project uses none of them — the icon comes from
        # CFBundleIconFile and the tint from SwiftUI's own Color.accentColor — and
        # that step is where "Failed to write Swift generated asset symbols" comes
        # from, so it is switched off outright.
        #
        # actool's real switch is --generate-swift-asset-symbols, driven by the
        # setting below (the name is taken from Xcode's own AssetCatalogCompiler
        # .xcspec). The _EXTENSIONS variant only governs the Swift-side extension
        # methods; it cannot stop the generation itself.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: FinderExtension
        embed: true
        codeSign: true
      - target: ScriptXPCService
        embed: true
        codeSign: true

  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
          # The menu is built in the extension process, so the localisation table has
          # to be in that bundle too — otherwise the context menu stays in the source
          # language. Added to the **existing** sources array: a second `sources:` key
          # would make the target drop the source files listed above.
      - path: RightKit/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dozecat.RightKit.FinderExtension
        PRODUCT_NAME: FinderExtension
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  ScriptXPCService:
    type: xpc-service
    platform: macOS
    sources:
      - path: ScriptXPCService
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dozecat.RightKit.ScriptXPCService
        PRODUCT_NAME: ScriptXPCService
        INFOPLIST_FILE: ScriptXPCService/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScriptXPCService/ScriptXPCService.entitlements
        SKIP_INSTALL: YES

  RightKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
      - path: AppCore
      # Only for its motion constants, which the reorder tests pin down. It has
      # no dependency beyond SwiftUI.
      - path: RightKit/Views/ReorderMotion.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dozecat.RightKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RightKit:
    build:
      targets:
        RightKit: all
        FinderExtension: all
        ScriptXPCService: all
    run:
      config: Debug
      executable: RightKit
    test:
      config: Debug
      targets:
        - RightKitTests
    archive:
      config: Release
